name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    # contents: 创建 release；id-token / attestations: 生成「构建来源证明」（见下面的 attest 步骤）
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 闸门：tag 必须与 manifest.json / package.json 的版本号相等，否则拒绝发布。
      #
      # 为什么需要：工作流对**任意** tag 触发，而版本号不匹配的 tag 会发出一个
      # "看起来正常、实则版本错乱"的 release —— 用户装上的是别的版本。
      # 顺带这也是 Obsidian 自身的规范：release tag 与 manifest version 完全相等（不带 v）。
      #
      # 脚本只用 Node 内置模块，所以放在 npm ci **之前** ——
      # 没理由先花几分钟装依赖，再去拒绝一个注定不合法的 tag。
      - name: Verify tag matches the plugin version
        run: node scripts/check-manifest.mjs --expect-version "$GITHUB_REF_NAME" --skip-assets

      - run: npm ci --ignore-scripts

      - name: Build plugin
        run: npm run build

      # 构建后再完整校验一次：把此前跳过的"发布资产齐备"补上
      - name: Verify release assets exist
        run: node scripts/check-manifest.mjs --expect-version "$GITHUB_REF_NAME"

      # 对三个发布资产生成**签名**的构建来源证明（sigstore）。
      #
      # 官方模板里有这一步，并注明"提交到社区目录时推荐"。它把"这个 main.js 是在
      # 这个 tag 的这个提交上、由这条工作流构建出来的"变成可验证的公开事实 ——
      # 否则用户只能选择相信 release 附件与仓库源码一致（本项目是开源的、
      # 且 main.js 不入库，所以正是这一步在衔接两者）。
      #
      # ⚠️ 必须在 `npm run build` 之后：它签名的是**产物本身**。
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # 先建 **draft**，人工核对三个附件后再手动 Publish。
      #
      # ⚠️ 顺序有意义：draft release 对 Obsidian 目录是**不可见**的。所以"发布"
      # 这一步必须由人确认后才发生 —— 一个附件缺失或版本号不对的 release
      # 一旦公开，就已经在给用户下载了。（用第一方 `gh` 而不是第三方 action：
      # 发布链路不再多一个需要信任的依赖。）
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title="$GITHUB_REF_NAME" \
            --draft \
            main.js manifest.json styles.css
